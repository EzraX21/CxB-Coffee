name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  APP_NAME: CxB-Coffee

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 创建虚拟环境并安装项目依赖
        run: uv sync --locked

      - name: 额外安装 pytest 和 pyinstaller
        run: uv pip install pytest pyinstaller

      - name: 先跑测试
        run: uv run --no-sync pytest -q

      - name: 再打包
        shell: bash
        run: |
          ICON_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            icon_file=$(ls icons/*.ico 2>/dev/null | head -n 1)
            if [ -n "$icon_file" ]; then
              ICON_ARGS=(--icon "$icon_file")
            fi
          fi

          uv run --no-sync pyinstaller \
            --onefile \
            --console \
            --name "$APP_NAME" \
            --clean \
            --noconfirm \
            "${ICON_ARGS[@]}" \
            main.py

          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -lR artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
