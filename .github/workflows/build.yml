name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  APP_NAME: CxB-Coffee

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 创建虚拟环境并安装项目依赖
        run: uv sync --locked

      - name: 额外安装 pytest 和 pyinstaller
        run: uv pip install pytest pyinstaller

      - name: 先跑测试
        run: uv run --no-sync pytest -q

      - name: 再打包
        shell: bash
        run: |
          ICON_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            icon_file=$(ls icons/*.ico 2>/dev/null | head -n 1)
            if [ -n "$icon_file" ]; then
              ICON_ARGS=(--icon "$icon_file")
            fi
          fi

          uv run --no-sync pyinstaller \
            --onefile \
            --console \
            --name "$APP_NAME-${{ matrix.artifact }}" \
            --clean \
            --noconfirm \
            "${ICON_ARGS[@]}" \
            main.py

          ls -lh dist/

      - name: 压成 zip
        shell: bash
        env:
          PKG_NAME: ${{ env.APP_NAME }}-${{ matrix.artifact }}
        run: |
          uv run --no-sync python - <<'PY'
          import os, pathlib, shutil, zipfile
          dist = pathlib.Path("dist")
          files = [f for f in dist.iterdir() if f.is_file() and f.suffix != ".zip"]
          out = dist / f"{os.environ['PKG_NAME']}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  info = zipfile.ZipInfo.from_file(f, f.name)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  with open(f, "rb") as src, z.open(info, "w") as dst:
                      shutil.copyfileobj(src, dst)
          print(f"{out}  {out.stat().st_size / 1024 / 1024:.2f} MB")
          for f in files:
              print(f"  内含: {f.name}  权限: {oct(f.stat().st_mode)[-3:]}")
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 校验三个平台的压缩包齐全
        run: |
          count=$(find artifacts -type f -name '*.zip' | wc -l)
          echo "压缩包数量: $count"
          find artifacts -type f -exec ls -lh {} \;
          if [ "$count" -ne 3 ]; then
            echo "::error::期望 3 个平台压缩包，实际只有 $count 个"
            exit 1
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
